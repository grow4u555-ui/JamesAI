version: '3.8'

services:
  # ১. এপিআই রউটার এবং অটো-ফেলওভার গেটওয়ে
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.0.0
    container_name: jarvis_litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    env_file:
      - .env
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: always

  # ২. ফিউচারিস্টিক ফ্রন্টএন্ড UI (LibreChat / Custom HUD)
  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    container_name: jarvis_ui
    ports:
      - "3080:3080"
    environment:
      - OPENAI_REVERSE_PROXY=http://litellm:4000/v1
    depends_on:
      - litellm
    restart: always

  # ৩. লোকাল অফলাইন এআই ইঞ্জিন (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: jarvis_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always

volumes:
  ollama_data:
