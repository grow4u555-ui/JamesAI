version: '3.8'

services:
  # 1. Arc Reactor HUD UI
  jarvis_ui:
    build: ./ui
    container_name: jarvis_ui
    ports:
      - "8080:80"
    restart: always

  # 2. LiteLLM Proxy Gateway
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.0.0
    container_name: jarvis_litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    env_file:
      - .env
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: always

  # 3. Multi-Agent Sandbox Engine
  sandbox:
    build: ./sandbox
    container_name: jarvis_sandbox
    environment:
      - LITELLM_URL=http://litellm:4000/v1
    depends_on:
      - litellm
    restart: always

  # 4. Local Offline Model Engine (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: jarvis_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always

volumes:
  ollama_data:
